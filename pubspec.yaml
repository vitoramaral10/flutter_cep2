name: flutter_cep2
description: 'Busca de CEP para Dart e Flutter: ViaCEP, BrasilAPI e OpenCEP com fallback, cache, coordenadas e validação offline. Brazilian ZIP code (CEP) lookup.'
version: 1.4.0
homepage: https://github.com/vitoramaral10/flutter_cep2
repository: https://github.com/vitoramaral10/flutter_cep2
issue_tracker: https://github.com/vitoramaral10/flutter_cep2/issues
funding:
  - https://github.com/sponsors/vitoramaral10

environment:
  sdk: ^3.0.0

dependencies:
  http: ^1.5.0
  xml: '>=6.4.2 <8.0.0'
  meta: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.33.0

topics:
  - cep
  - brazil
  - address
  - zipcode
  - viacep

screenshots:
  - description: Example app showing the address found for CEP 01310-100.
    path: doc/images/example-app.webp

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

name: flutter_cep2
description: Brazilian ZIP code (CEP) lookup for Dart and Flutter, backed by the ViaCEP API. JSON or XML, typed model, clear errors, every platform.
version: 1.1.0
homepage: https://github.com/vitoramaral10/flutter_cep2
repository: https://github.com/vitoramaral10/flutter_cep2
issue_tracker: https://github.com/vitoramaral10/flutter_cep2/issues
funding:
  - https://github.com/sponsors/vitoramaral10

environment:
  sdk: ^3.0.0

dependencies:
  http: ^1.5.0
  xml: '>=6.4.2 <8.0.0'
  meta: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.33.0

topics:
  - cep
  - brazil
  - address
  - zipcode
  - viacep

screenshots:
  - description: Example app showing the address found for CEP 01310-100.
    path: doc/images/example-app.webp

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
